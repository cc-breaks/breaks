<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>مركز الاتصال</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="theme-color" content="#00344B">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="مركز الاتصال">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>
  html, body { margin: 0; height: 100%; background: #00344B; }
  iframe { position: fixed; inset: 0; width: 100%; height: 100%; border: 0; background: #fff; }
  #bell { position: fixed; left: 12px; bottom: calc(12px + env(safe-area-inset-bottom)); z-index: 5;
    font: 600 14px Tahoma, sans-serif; background: #40BCA9; color: #00344B; border: 0; border-radius: 22px;
    padding: 10px 16px; box-shadow: 0 2px 8px rgba(0,0,0,.3); }
  #panel { position: fixed; inset: auto 12px calc(64px + env(safe-area-inset-bottom)) 12px; z-index: 6; display: none;
    background: #fff; color: #0D2430; border-radius: 12px; padding: 14px; font: 14px/1.6 Tahoma, sans-serif;
    box-shadow: 0 4px 16px rgba(0,0,0,.35); }
  #panel button { margin-top: 8px; padding: 8px 14px; border: 0; border-radius: 8px; background: #00344B; color: #fff; font: inherit; }
</style>
</head>
<body>
<iframe id="app" src="https://script.google.com/macros/s/AKfycbyFn1reZjGeW93Cnw66EwqIUuVnBE6zCPfcyoqi05hHrt54e89EDT41PN3eJQG25TUG/exec" allow="autoplay; clipboard-write"></iframe>
<button id="bell" type="button">🔔 تفعيل الإشعارات</button>
<div id="panel"><div id="msg"></div><button id="close" type="button">إغلاق</button></div>

<script>
var $ = function (id) { return document.getElementById(id); };
function say(t) { $('msg').textContent = t; $('panel').style.display = 'block'; }
$('close').onclick = function () { $('panel').style.display = 'none'; };

if (!('Notification' in window)) {
  $('bell').onclick = function () { say('هذا المتصفح لا يدعم الإشعارات. استخدم Chrome أو Edge على الكمبيوتر.'); };
} else {
  var on = function () { $('bell').textContent = '🔔 الإشعارات مفعّلة'; };
  if (Notification.permission === 'granted') on();
  $('bell').onclick = function () {
    Notification.requestPermission().then(function (p) {
      if (p === 'granted') { on(); say('تم تفعيل الإشعارات على هذا الجهاز.'); }
      else say('لم يتم السماح بالإشعارات. فعّلها من إعدادات المتصفح (أيقونة القفل بجانب الرابط).');
    });
  };
  // تنبيهات النظام (داخل الإطار) تظهر كإشعار ويندوز عندما تكون النافذة غير نشطة
  window.addEventListener('message', function (e) {
    var d = e.data;
    if (!d || d.brk !== 'notify' || !/^https:\/\/[a-z0-9-]+\.googleusercontent\.com$/.test(e.origin)) return;
    if (Notification.permission !== 'granted' || document.hasFocus()) return;
    try { var n = new Notification('مركز الاتصال', { body: String(d.body || ''), icon: 'icon-192.png' }); n.onclick = function () { window.focus(); n.close(); }; } catch (err) {}
  });
}
</script>
</body>
</html>
